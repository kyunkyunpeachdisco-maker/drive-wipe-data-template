name: watch-video

# 台本の材料を用意する。videos/request.txt に書かれた依頼を上から順に片づける。
#   - フィードの新着記事の本文を articles/ に取り込む（AIを使わない。毎回行う）
#   - 動画を Gemini に見せて「何分何秒に何が映っているか」を videos/<動画ID>.json に記録する
# 依頼の書き方（1行に1つ。終わった行は自動で消える）:
#   https://www.youtube.com/watch?v=XXXX       この動画を最後まで記録する
#   https://www.youtube.com/watch?v=XXXX 30    最初の30分だけ記録する
#   候補                                       前に使ったチャンネルの新着を videos/candidates.md に並べる
#   候補 北海道 海沿い                          キーワードで探した候補を並べる
#   記事                                       記事の取り込みだけ
# Gemini の1日の枠が尽きて途中で止まった動画は、依頼を残しておき、翌日の夕方に自動で続きを記録する。
# 必要な Secrets: GEMINI_API_KEY（Google AI Studio のキー）、YOUTUBE_API_KEY（YouTube Data API v3 のキー）
# 処理の中身は tools/watch-requests.sh（道具の更新で新しくなる）

on:
  push:
    branches: [master, main]
    paths:
      - 'videos/request.txt'
  workflow_dispatch:
  schedule:
    - cron: '13 8 * * *'   # 日本時間 17時13分。Gemini の枠が戻ったあと。依頼が残っているときだけ動く

permissions:
  contents: write

concurrency:
  group: watch-video
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 依頼を片づける
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: bash tools/watch-requests.sh
